<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just a question...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            overflow: hidden; /* Keep the chaos contained */
        }

        .hand-font {
            font-family: 'Patrick Hand', cursive;
        }

        /* Floating Hearts Animation */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            bottom: -100px;
            font-size: 24px;
            color: rgba(255, 182, 193, 0.6);
            animation: floatUp 15s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* Button Styling */
        #noBtn {
            transition: all 0.1s ease; /* Faster transition for snappier movement */
            position: relative;
            z-index: 9999; /* MAXIMUM PRIORITY: Always on top of everything */
        }

        #yesBtn {
            transition: transform 0.2s ease;
            z-index: 1; /* Base level */
            /* Removed fixed positioning so it stays in flow */
        }

        /* Wiggle Animation for No Button */
        .wiggle {
            animation: wiggle 0.5s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .hidden-step {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        .visible-step {
            display: flex;
            opacity: 1;
            z-index: 10;
            position: relative;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center bg-pink-50 relative selection:bg-pink-200">

    <!-- Background Hearts Container -->
    <div class="hearts-bg" id="heartsContainer"></div>

    <!-- Main Card -->
    <div class="relative w-full max-w-md mx-4">
        
        <!-- Step 1: The Question -->
        <div id="askStep" class="visible-step flex-col items-center bg-white/80 backdrop-blur-sm p-8 rounded-3xl shadow-xl border-4 border-white ring-4 ring-pink-100 text-center">
            
            <div class="text-6xl mb-4 animate-bounce">
                🐻💌
            </div>

            <h1 class="text-2xl md:text-3xl font-bold text-pink-600 mb-2 leading-tight relative z-10">
                Just wanted to let you know that your smile is the cutest thing I saw today. 😍
            </h1>
            <p class="text-gray-600 text-lg mb-8 mt-4 hand-font font-semibold relative z-10">
                Will you consider going out with me to see if we vibe? 😁👉🏻👈🏻
            </p>

            <div class="flex flex-wrap justify-center gap-4 w-full relative min-h-[60px] items-center">
                <button id="yesBtn" onclick="handleYes()" class="px-8 py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-full shadow-lg text-xl transform origin-center">
                    Yes! 😍
                </button>
                
                <button id="noBtn" class="px-8 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-full shadow-md text-xl whitespace-nowrap">
                    No I Won't
                </button>
            </div>
        </div>

        <!-- Step 2: Success -->
        <div id="successStep" class="hidden-step flex-col items-center bg-white/90 backdrop-blur-md p-10 rounded-3xl shadow-2xl border-4 border-pink-300 text-center relative z-50">
            <div class="text-8xl mb-6 animate-pulse">
                💖
            </div>
            <h2 class="text-4xl font-bold text-pink-600 mb-4">Thank you! 😍</h2>
            <p class="text-xl text-gray-700 hand-font">
                Hehe!! I knew that. You made my day! <br>
                <span class="text-sm text-gray-500 mt-2 block">(Send me a screenshot of this screen please!)</span>
            </p>
            <div class="mt-8 text-pink-400 text-sm">
                📅 Date details pending...
            </div>
        </div>

    </div>

    <script>
        const phrases = [
            "Please? 🥹👉🏻👈🏻",
            "Are you sure? 🧐",
            "Don't be mean! 😭",
            "Think again! 💭",
            "Look at my sad face 😿",
            "I'll buy food! 🍕",
            "Just one date? 🌹",
            "Pretty please? 🍒",
            "Big mistake! 🙈",
            "Don't break my heart 💔",
            "Click the Pink one! 😡",
            "Last chance! ⚠️",
            "You're breaking up with me already? 😩",
            "I promise I'm fun! 🎢"
        ];

        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const askStep = document.getElementById('askStep');
        const successStep = document.getElementById('successStep');
        const heartsContainer = document.getElementById('heartsContainer');

        let phraseIndex = 0;
        let scaleFactor = 1;

        // --- Hearts Animation ---
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = ['❤️', '💖', '🌸', '✨', '🦋'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 10 + 10 + 's';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 20000);
        }
        setInterval(createHeart, 500);

        // --- Interaction Logic ---
        const moveButton = () => {
            // 1. Change text to next phrase
            noBtn.innerText = phrases[phraseIndex];
            phraseIndex = (phraseIndex + 1) % phrases.length;

            // 2. Move "No" Button (Strict Boundary Enforcement)
            
            // Force strict Fixed positioning to escape any flex container constraints
            noBtn.style.position = 'fixed';
            
            // Get viewport dimensions
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            
            // Get button dimensions *after* text update
            const btnRect = noBtn.getBoundingClientRect();
            const btnWidth = btnRect.width;
            const btnHeight = btnRect.height;
            
            // Define safe area (padding from edge)
            const padding = 20;
            
            // Calculate max allowable X and Y positions
            const maxX = viewportWidth - btnWidth - padding;
            const maxY = viewportHeight - btnHeight - padding;
            
            // Generate random position within safe area
            // Math.max(padding, ...) ensures it doesn't go off the top/left
            // Math.min(maxX, ...) ensures it doesn't go off the bottom/right
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            // Apply new coordinates
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // 3. Grow "Yes" Button in Place
            scaleFactor += 0.5;
            yesBtn.style.transform = `scale(${scaleFactor})`;
            
            // 4. Add wiggle effect to "No" button
            noBtn.classList.remove('wiggle');
            void noBtn.offsetWidth; // Trigger reflow
            noBtn.classList.add('wiggle');
        };

        // Handle both Click and Touch
        const handleNoInteraction = (e) => {
            e.preventDefault(); // Stop default behavior
            e.stopPropagation(); // Stop event bubbling
            moveButton();
        };

        noBtn.addEventListener('click', handleNoInteraction);
        noBtn.addEventListener('touchstart', handleNoInteraction);

        // --- Success Logic ---
        function handleYes() {
            askStep.style.opacity = '0';
            noBtn.style.display = 'none';
            // We don't remove yesBtn immediately to prevent jarring layout shift before fade
            
            setTimeout(() => {
                askStep.style.display = 'none';
                successStep.style.display = 'flex';
                requestAnimationFrame(() => successStep.style.opacity = '1');
                triggerConfetti();
            }, 500);
        }

        function triggerConfetti() {
            const duration = 3000;
            const end = Date.now() + duration;
            const colors = ['#bb0000', '#ffffff'];

            (function frame() {
                confetti({
                    particleCount: 2,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 2,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Prevent Pinch Zoom
        document.addEventListener('touchmove', (e) => {
            if (e.scale !== 1) e.preventDefault();
        }, { passive: false });

    </script>
</body>
</html>
